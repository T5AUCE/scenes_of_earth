[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soe"
version = "0.2.0"
description = "Scenes of Earth backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "numpy",
    "rasterio>=1.4",
    "zarr>=3",
    "shapely>=2",
]

[project.optional-dependencies]
import = ["geopandas"]
dev = ["pytest", "httpx"]

[project.scripts]
soe = "soe.cli:main"

[tool.setuptools]
packages = ["soe", "soe.sources"]

[tool.setuptools.package-data]
soe = ["data/glo30_tiles.bin", "data/glo90_tiles.bin", "data/sample_areas.geojson"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
